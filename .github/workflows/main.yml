name: OLX Automation
on:
  schedule:
    - cron: '0 09 * * *'
    - cron: '0 15 * * *'
    - cron: '15 15 * * *'
    - cron: '55 20 * * *'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  run-robot:
    # Precisa rodar de um IP residencial: o Cloudflare da OLX bloqueia os
    # IPs de datacenter dos runners hospedados do GitHub (ubuntu-latest).
    runs-on: self-hosted
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      # Usa o Python e o Node ja instalados na maquina self-hosted.
      # As actions setup-python/setup-node nao instalam runtimes nesses
      # runners; um venv isola as dependencias do Python global da maquina.
      - name: Instalar dependências
        run: |
          python -m venv .venv
          .\.venv\Scripts\python -m pip install --upgrade pip
          .\.venv\Scripts\pip install -r requirements.txt

      - name: Inicializar RF-Browser
        run: .\.venv\Scripts\rfbrowser init

      - name: Rodar automação
        env:
          GMAIL_SENHA: ${{ secrets.GMAIL_SENHA }}
        run: .\.venv\Scripts\robot -d ./log tests/suites/suite01.robot

      - name: Salvar logs como artefato
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: robot-logs
          path: ./log/
